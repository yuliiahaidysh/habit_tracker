name: Run Tests

# 1. Define what events trigger the tests
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# 2. Define the execution steps
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-node-version: '20'

    - name: Install Dependencies
      run: npm install

    - name: Run Test Suite
      run: npm test
