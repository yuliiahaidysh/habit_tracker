name: Run Tests

# 1. Define what events trigger the tests
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# 2. Define the execution steps
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install Dependencies
      run: npm install
      continue-on-error: false

    - name: Generate Prisma Client
      env:
        DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      run: |
        cd server
        npx prisma generate

    - name: Run Test Suite
      run: npm test
